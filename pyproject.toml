[project]
name = "supervisor-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "faker>=40.41.0",
    "jupyter>=1.1.1",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-community<0.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.13",
    "langsmith>=0.14.4",
    "notebook>=7.6.3",
    "openai>=3.24.0",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "ragas>=0.3.1",
    "rapidfuzz>=3.14.6",
    "sentence-transformers>=6.1.0",
    "tavily-python>=0.8.4",
]

[project.scripts]
supervisor-agent = "supervisor_agent:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
